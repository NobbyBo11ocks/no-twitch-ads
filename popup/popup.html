<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>No Twitch Ads</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img class="logo" src="../icons/icon48.png" alt="" width="24" height="24" />
      <h1>No Twitch Ads</h1>
      <span class="ver" id="version"></span>
      <label class="tgl" title="Ad skipping on or off">
        <input type="checkbox" id="enabled" aria-label="Ad skipping" />
        <span class="tglt"></span>
      </label>
    </header>

    <div class="stats">
      <div class="row">
        <span class="k">Ads skipped</span>
        <span class="v" id="adsSkipped">0</span>
      </div>
      <div class="row">
        <span class="k">Points claimed</span>
        <span class="v" id="pointsClaimed">0</span>
      </div>
      <div class="row">
        <span class="k">Time saved</span>
        <span class="v" id="timeSaved">0m</span>
      </div>
    </div>

    <label class="opt">
      <span class="o-title">Auto-claim channel points</span>
      <span class="tgl"><input type="checkbox" id="autoClaimPoints" /><span class="tglt"></span></span>
    </label>

    <footer>
      <a href="https://github.com/NobbyBo11ocks/no-twitch-ads" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/NobbyBo11ocks/no-twitch-ads/issues" target="_blank" rel="noopener">Report a problem</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
