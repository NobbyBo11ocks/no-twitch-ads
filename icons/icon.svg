  </defs>
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#g)"/>
  <rect x="5" y="5" width="118" height="118" rx="26.25" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- chat bubble -->
