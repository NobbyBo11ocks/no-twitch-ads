<!doctype html>
<!-- Dev helper: renders the popup at its real size on a magenta backdrop so a
     screenshot can be cropped to the popup automatically (crop to the
     non-magenta bounding box). Serve the repo with `node tools/serve.js` and
     open http://127.0.0.1:8765/tools/popup-preview.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>popup preview</title>
    <style>
      html, body { margin: 0; background: #ff00ff; }
      iframe { display: block; border: 0; width: 340px; height: 560px; margin: 0; }
    </style>
  </head>
  <body>
    <iframe src="../popup/popup.html" title="popup"></iframe>
  </body>
</html>
